<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>完善信息 - 紫色主题</title>
  <style>
    :root {
      --primary: #7b5cf2;
      --primary-dark: #5a3fca;
      --bg: #f5f3ff;
      --card: #ffffff;
      --text: #1f1f2b;
      --muted: #6b6b7a;
      --shadow: 0 14px 40px rgba(93, 67, 210, 0.18);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      font-family: "Inter", "Helvetica", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #f3eefe, #faf7ff);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .phone {
      width: 390px;
      min-height: 760px;
      background: var(--bg);
      border-radius: 32px;
      padding: 20px;
      box-shadow: 0 24px 60px rgba(51, 24, 128, 0.25);
      border: 1px solid rgba(123, 92, 242, 0.15);
      position: relative;
      overflow: hidden;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      padding: 4px 2px 14px;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(140deg, rgba(123, 92, 242, 0.15), rgba(255, 255, 255, 0));
      pointer-events: none;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    .subtitle { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .field { position: relative; margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
    .input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.4px solid rgba(123, 92, 242, 0.35);
      background: #fcfbff;
      font-size: 15px;
      transition: all 160ms ease;
    }
    .input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(123, 92, 242, 0.12);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(120deg, var(--primary), #9b7bff);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: 0 16px 32px rgba(123, 92, 242, 0.35);
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
      margin-top: 6px;
    }
    .btn:hover { filter: brightness(1.03); }
    .btn:active { transform: translateY(1px); box-shadow: 0 10px 24px rgba(123, 92, 242, 0.32); }
    .toast {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 10px 12px;
      background: #1f1f2b;
      color: #fff;
      border-radius: 12px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: 200ms ease;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      z-index: 10;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .footnote { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }
    .top-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .back-btn {
      width: 32px; height: 32px; border-radius: 10px;
      background: rgba(123,92,242,0.1); display: grid; place-items: center;
      cursor: pointer; font-size: 20px; color: var(--primary-dark);
    }
    .info-panel {
      background: #fcfbff;
      border: 1px solid rgba(123,92,242,0.2);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05);
      font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--muted); }
    .info-value { font-weight: 600; color: var(--text); text-align: right; max-width: 60%; word-break: break-all; }
    .status-ok {
      display: inline-flex; align-items: center; gap: 6px;
      color: #16a34a; font-size: 13px; font-weight: 600; margin-bottom: 12px;
    }
    .btn.secondary {
      background: #fff;
      color: var(--primary-dark);
      border: 1.5px solid rgba(123,92,242,0.35);
      box-shadow: none;
    }
    .hidden { display: none !important; }
    .loan-tip {
      background: rgba(123,92,242,0.1);
      color: var(--primary-dark);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <section class="phone" aria-label="完善信息">
    <div class="toast" id="toast">请完善资料</div>
    <div class="status-bar">
      <span>09:41</span><span>LTE · 79%</span>
    </div>
    <div class="top-bar">
      <div class="back-btn" id="backBtn">‹</div>
      <strong>个人资料</strong>
    </div>
    <div class="card">
      <h1 id="pageTitle">身份核验</h1>
      <p class="subtitle" id="pageSubtitle">填写实名信息并上传身份证正反面，完成后即可申请借款</p>
      <div class="loan-tip hidden" id="loanTip">提交身份证信息后，即可返回首页继续借款。</div>

      <!-- 已提交：展示模式 -->
      <div id="viewSection" class="hidden">
        <div class="status-ok">✓ 身份证信息已提交</div>
        <div class="info-panel">
          <div class="info-row">
            <span class="info-label">真实姓名</span>
            <span class="info-value" id="viewUserName">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">身份证号</span>
            <span class="info-value" id="viewIdCard">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">手机号</span>
            <span class="info-value" id="viewPhone">-</span>
          </div>
        </div>
        <button class="btn secondary" id="editBtn" type="button">修改</button>
        <button class="btn" id="viewBackBtn" type="button">返回首页</button>
      </div>

      <!-- 未提交 / 修改：表单模式 -->
      <div id="formSection">
      <div class="field">
        <label>真实姓名</label>
        <input id="userName" class="input" type="text" placeholder="与身份证一致" />
      </div>
      <div class="field">
        <label>身份证号码</label>
        <input id="idCardNumber" class="input" type="text" maxlength="18" placeholder="18位身份证号" />
      </div>

      <div class="field">
        <label style="display:flex; justify-content:space-between; align-items:center;">
          <span>身份证人像面</span>
          <small style="color:var(--muted);">仅用于身份验证</small>
        </label>
        <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
          <input id="idFront" class="input" type="file" accept="image/*" style="flex:1;" />
          <button type="button" class="btn" style="width:120px; padding:12px;" id="captureFront">拍照</button>
          <input id="idFrontCapture" type="file" accept="image/*" capture="environment" style="display:none;" />
        </div>
        <div style="display:flex; justify-content:center;">
          <img src="id-front-sample.jpg" alt="人像面示意图" style="width:200px; border-radius:14px; border:1px solid rgba(123,92,242,0.25); box-shadow:0 10px 22px rgba(0,0,0,0.1);" />
        </div>
      </div>

      <div class="field">
        <label style="display:flex; justify-content:space-between; align-items:center;">
          <span>身份证国徽面</span>
          <small style="color:var(--muted);">仅用于身份验证</small>
        </label>
        <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
          <input id="idBack" class="input" type="file" accept="image/*" style="flex:1;" />
          <button type="button" class="btn" style="width:120px; padding:12px;" id="captureBack">拍照</button>
          <input id="idBackCapture" type="file" accept="image/*" capture="environment" style="display:none;" />
        </div>
        <div style="display:flex; justify-content:center;">
          <img src="id-back-sample.jpg" alt="国徽面示意图" style="width:200px; border-radius:14px; border:1px solid rgba(123,92,242,0.25); box-shadow:0 10px 22px rgba(0,0,0,0.1);" />
        </div>
      </div>

      <button class="btn" id="saveProfile">提交并返回首页</button>
      <button class="btn secondary hidden" id="cancelEditBtn" type="button">取消修改</button>
      <div class="footnote" id="formFootnote">提交后可在首页点击「立即借款」</div>
      </div>
    </div>
  </section>

  <script src="../js/api-config.js"></script>
  <script>
    const API_BASE = (window.ZongsheApi && ZongsheApi.getApiBase()) || (localStorage.getItem('apiBase') || 'http://localhost:8080');
    const toast = document.getElementById('toast');
    const showToast = (msg) => {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1400);
    };

    function getAuthToken() {
      const raw = (localStorage.getItem('token') || sessionStorage.getItem('token') || '').trim();
      if (!raw || raw === 'undefined' || raw === 'null') return '';
      return raw.startsWith('Bearer ') ? raw.slice(7).trim() : raw;
    }

    async function request(path, options = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
      const token = getAuthToken();
      if (token) headers.Authorization = `Bearer ${token}`;
      const res = await fetch(`${API_BASE}${path}`, {
        method: options.method || 'GET',
        headers,
        body: options.body ? JSON.stringify(options.body) : undefined
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || `请求失败(${res.status})`);
      return data;
    }

    const params = new URLSearchParams(window.location.search);
    const fromLoan = params.get('from') === 'loan';
    let hasSubmittedIdentity = false;
    let editingExisting = false;

    const viewSection = document.getElementById('viewSection');
    const formSection = document.getElementById('formSection');
    const pageTitle = document.getElementById('pageTitle');
    const pageSubtitle = document.getElementById('pageSubtitle');
    const loanTip = document.getElementById('loanTip');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const saveBtn = document.getElementById('saveProfile');

    function identityCacheKey() {
      return `identityCache_${localStorage.getItem('userId') || ''}`;
    }

    function showViewMode(user) {
      hasSubmittedIdentity = true;
      viewSection.classList.remove('hidden');
      formSection.classList.add('hidden');
      pageTitle.textContent = '个人资料';
      pageSubtitle.textContent = '您的实名信息已保存，可用于借款审核';
      document.getElementById('viewUserName').textContent = user.userName || '-';
      document.getElementById('viewIdCard').textContent = user.idCardNumber || '-';
      document.getElementById('viewPhone').textContent = user.phoneNumber || '-';
    }

    function showFormMode(isEdit) {
      editingExisting = isEdit;
      viewSection.classList.add('hidden');
      formSection.classList.remove('hidden');
      pageTitle.textContent = isEdit ? '修改身份信息' : '身份核验';
      pageSubtitle.textContent = isEdit
        ? '可更新姓名与身份证号，证件照片可选重新上传'
        : '填写实名信息并上传身份证正反面，完成后即可申请借款';
      cancelEditBtn.classList.toggle('hidden', !isEdit);
      saveBtn.textContent = isEdit ? '保存修改' : '提交并返回首页';
      if (fromLoan && !isEdit) loanTip.classList.remove('hidden');
      else loanTip.classList.add('hidden');

      if (isEdit) {
        try {
          const cache = JSON.parse(localStorage.getItem(identityCacheKey()) || '{}');
          if (cache.userName) document.getElementById('userName').value = cache.userName;
          if (cache.idCardNumber) document.getElementById('idCardNumber').value = cache.idCardNumber;
        } catch (_) {}
      }
    }

    async function loadProfile() {
      const userId = localStorage.getItem('userId');
      if (!userId || !getAuthToken()) {
        showToast('请先登录');
        setTimeout(() => { window.location.href = '../login-prototype.html'; }, 800);
        return;
      }
      try {
        const user = await request(`/api/users/${userId}`);
        if (user.idCardNumber && String(user.idCardNumber).length >= 15) {
          showViewMode(user);
        } else {
          showFormMode(false);
        }
      } catch (e) {
        showFormMode(false);
      }
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = '../main-home.html';
    });
    document.getElementById('viewBackBtn').addEventListener('click', () => {
      window.location.href = '../main-home.html';
    });
    document.getElementById('editBtn').addEventListener('click', () => {
      showFormMode(true);
      const name = document.getElementById('viewUserName').textContent;
      if (name && name !== '-') {
        document.getElementById('userName').value = name;
      }
    });
    cancelEditBtn.addEventListener('click', () => loadProfile());

    // 拍照按钮触发隐藏的 capture input
    document.getElementById('captureFront').addEventListener('click', () => {
      document.getElementById('idFrontCapture').click();
    });
    document.getElementById('captureBack').addEventListener('click', () => {
      document.getElementById('idBackCapture').click();
    });
    // 将拍照得到的文件写回主 input，便于统一校验
    document.getElementById('idFrontCapture').addEventListener('change', (e) => {
      if (e.target.files?.[0]) {
        document.getElementById('idFront').files = e.target.files;
        showToast('人像面已通过拍照选择');
      }
    });
    document.getElementById('idBackCapture').addEventListener('change', (e) => {
      if (e.target.files?.[0]) {
        document.getElementById('idBack').files = e.target.files;
        showToast('国徽面已通过拍照选择');
      }
    });

    // 保存实名信息
    document.getElementById('saveProfile').addEventListener('click', async () => {
      const userName = document.getElementById('userName').value.trim();
      const idCardNumber = document.getElementById('idCardNumber').value.trim();
      const idFront = document.getElementById('idFront').files?.[0];
      const idBack = document.getElementById('idBack').files?.[0];

      if (!userName) {
        showToast('请填写真实姓名');
        return;
      }
      if (!/^\d{17}[\dXx]$/.test(idCardNumber)) {
        showToast('请输入有效的18位身份证号');
        return;
      }
      if (!idFront && !editingExisting) {
        showToast('请上传身份证人像面');
        return;
      }
      if (!idBack && !editingExisting) {
        showToast('请上传身份证国徽面');
        return;
      }

      const userId = localStorage.getItem('userId');
      if (!userId || !getAuthToken()) {
        showToast('请先登录');
        setTimeout(() => { window.location.href = '../login-prototype.html'; }, 800);
        return;
      }

      const btn = document.getElementById('saveProfile');
      btn.disabled = true;
      btn.textContent = '提交中…';
      try {
        const data = await request(`/api/users/${userId}/identity`, {
          method: 'PUT',
          body: { userName, idCardNumber: idCardNumber.toUpperCase() }
        });
        if (!data.success) throw new Error(data.message || '提交失败');
        localStorage.setItem(identityCacheKey(), JSON.stringify({
          userName,
          idCardNumber: idCardNumber.toUpperCase()
        }));
        showToast(editingExisting ? '身份信息已更新' : '身份信息已提交');
        const backTo = fromLoan && !editingExisting ? '../loan-home.html' : '../main-home.html';
        setTimeout(() => { window.location.href = backTo; }, 900);
      } catch (e) {
        showToast(e.message || '提交失败');
        btn.disabled = false;
        btn.textContent = editingExisting ? '保存修改' : '提交并返回首页';
      }
    });

    loadProfile();
  </script>
</body>
</html>

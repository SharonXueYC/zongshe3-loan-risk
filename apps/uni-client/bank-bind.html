<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>银行卡管理 - 紫色主题</title>
  <style>
    :root {
      --primary: #7b5cf2;
      --primary-dark: #5a3fca;
      --bg: #f5f3ff;
      --card: #ffffff;
      --text: #1f1f2b;
      --muted: #6b6b7a;
      --shadow: 0 18px 40px rgba(93, 67, 210, 0.18);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      font-family: "Inter", "Helvetica", "PingFang SC", sans-serif;
      background: linear-gradient(180deg, #f3eefe 0%, #faf7ff 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .phone {
      width: 390px;
      min-height: 760px;
      background: linear-gradient(180deg, #7b5cf2 0%, #9b7bff 55%, #ffffff 100%);
      border-radius: 32px;
      padding: 20px;
      box-shadow: 0 24px 60px rgba(93, 67, 210, 0.25);
      border: 1px solid rgba(123, 92, 242, 0.14);
      position: relative;
      overflow: hidden;
      color: #fff;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      padding: 4px 2px 14px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .back-btn {
      width: 32px; height: 32px; border-radius: 10px;
      background: rgba(255,255,255,0.15);
      display: grid; place-items: center; cursor: pointer; font-size: 20px;
    }
    .top-title { font-size: 17px; font-weight: 700; }
    .card {
      background: #fff;
      color: var(--text);
      border-radius: var(--radius);
      padding: 20px 18px;
      box-shadow: var(--shadow);
      margin-top: 10px;
    }
    .card h1 { margin: 0 0 6px; font-size: 22px; }
    .subtitle { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .section-title {
      font-size: 14px; font-weight: 700; margin: 0 0 10px; color: #1d1d2b;
    }
    .bank-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(123,92,242,0.08), rgba(155,123,255,0.12));
      border: 1px solid rgba(123,92,242,0.18);
      margin-bottom: 10px;
    }
    .bank-item.default { border-color: var(--primary); }
    .bank-name { font-size: 14px; font-weight: 700; }
    .bank-no { font-size: 13px; color: var(--muted); margin-top: 4px; letter-spacing: 1px; }
    .bank-tag {
      font-size: 11px; padding: 3px 8px; border-radius: 999px;
      background: rgba(123,92,242,0.15); color: var(--primary-dark); font-weight: 600;
    }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.4px solid rgba(123, 92, 242, 0.35);
      background: #fcfbff;
      font-size: 15px;
    }
    .input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(123, 92, 242, 0.12);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(120deg, var(--primary), #9b7bff);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 16px 32px rgba(123, 92, 242, 0.35);
      margin-top: 6px;
    }
    .btn.secondary {
      background: #fff;
      color: var(--primary-dark);
      border: 1.5px solid rgba(123,92,242,0.35);
      box-shadow: none;
    }
    .btn:hover { filter: brightness(1.03); }
    .hidden { display: none !important; }
    .toast {
      position: absolute;
      top: 16px; right: 16px;
      padding: 10px 12px;
      background: #1f1f2b;
      color: #fff;
      border-radius: 12px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: 200ms ease;
      z-index: 10;
    }
    .toast.show { opacity: 1; }
    .info {
      background: rgba(123,92,242,0.08);
      color: var(--primary-dark);
      border: 1px solid rgba(123,92,242,0.2);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .empty-hint {
      text-align: center; color: var(--muted); font-size: 13px; padding: 16px 0;
    }
  </style>
</head>
<body>
  <section class="phone" aria-label="银行卡管理">
    <div class="toast" id="toast">请输入银行卡信息</div>
    <div class="status-bar">
      <span>09:41</span><span>LTE · 75%</span>
    </div>
    <div class="top-bar">
      <div class="back-btn" id="backBtn">‹</div>
      <span class="top-title">银行卡</span>
    </div>

    <div class="card">
      <h1 id="pageTitle">绑定银行卡</h1>
      <p class="subtitle">用于资金放款与还款，信息仅用于本次业务</p>

      <div id="boundSection" class="hidden">
        <p class="section-title">已绑定银行卡</p>
        <div id="boundList"></div>
        <button class="btn secondary" id="addOtherBtn" type="button">绑定其他银行卡</button>
      </div>

      <div id="formSection">
        <div class="info">仅支持持卡人本人的储蓄卡，信息加密传输</div>
        <div class="field">
          <label for="bankName">开户行</label>
          <input id="bankName" class="input" type="text" placeholder="如：建设银行" />
        </div>
        <div class="field">
          <label for="cardNo">银行卡号</label>
          <input id="cardNo" class="input" type="tel" inputmode="numeric" placeholder="请输入银行卡号" />
        </div>
        <div class="field">
          <label for="phone">预留手机号</label>
          <input id="phone" class="input" type="tel" inputmode="numeric" placeholder="银行预留手机号" />
        </div>
        <div class="field" style="display:flex; gap:10px; align-items:center;">
          <input id="smsCode" class="input" type="tel" inputmode="numeric" placeholder="短信验证码" style="flex:1;" />
          <button class="btn secondary" type="button" style="width:130px; padding:12px; margin-top:0;" id="sendCode">获取验证码</button>
        </div>
        <button class="btn" id="bindBtn">确认绑定</button>
        <button class="btn secondary hidden" id="cancelAddBtn" type="button">取消</button>
      </div>
    </div>
  </section>

  <script>
    const toast = document.getElementById('toast');
    const showToast = (msg) => {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1400);
    };

    function storageKey() {
      const userId = localStorage.getItem('userId') || 'guest';
      return `bankCards_${userId}`;
    }

    function maskCardNo(cardNo) {
      const digits = String(cardNo).replace(/\s/g, '');
      if (digits.length < 8) return digits;
      return `${digits.slice(0, 4)} **** **** ${digits.slice(-4)}`;
    }

    function loadCards() {
      try {
        return JSON.parse(localStorage.getItem(storageKey()) || '[]');
      } catch (_) {
        return [];
      }
    }

    function saveCards(cards) {
      localStorage.setItem(storageKey(), JSON.stringify(cards));
    }

    const boundSection = document.getElementById('boundSection');
    const boundList = document.getElementById('boundList');
    const formSection = document.getElementById('formSection');
    const pageTitle = document.getElementById('pageTitle');
    const addOtherBtn = document.getElementById('addOtherBtn');
    const cancelAddBtn = document.getElementById('cancelAddBtn');

    function clearForm() {
      document.getElementById('bankName').value = '';
      document.getElementById('cardNo').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('smsCode').value = '';
    }

    function showForm(show) {
      formSection.classList.toggle('hidden', !show);
      cancelAddBtn.classList.toggle('hidden', !show || loadCards().length === 0);
    }

    function renderBoundCards() {
      const cards = loadCards();
      if (!cards.length) {
        boundSection.classList.add('hidden');
        showForm(true);
        pageTitle.textContent = '绑定银行卡';
        return;
      }

      boundSection.classList.remove('hidden');
      pageTitle.textContent = '我的银行卡';
      boundList.innerHTML = cards.map((c, i) => `
        <div class="bank-item ${i === 0 ? 'default' : ''}">
          <div>
            <div class="bank-name">${c.bankName || '银行卡'}</div>
            <div class="bank-no">${c.masked || maskCardNo(c.cardNo)}</div>
          </div>
          ${i === 0 ? '<span class="bank-tag">默认</span>' : ''}
        </div>
      `).join('');

      showForm(false);
    }

    addOtherBtn.addEventListener('click', () => {
      clearForm();
      showForm(true);
      pageTitle.textContent = '绑定其他银行卡';
    });

    cancelAddBtn.addEventListener('click', () => {
      clearForm();
      renderBoundCards();
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'main-home.html';
    });

    const sendBtn = document.getElementById('sendCode');
    let timer = 0, timerId = null;
    sendBtn.addEventListener('click', () => {
      if (timer > 0) return;
      const phone = document.getElementById('phone').value.trim();
      if (!phone || phone.length < 6) {
        showToast('请输入预留手机号');
        return;
      }
      timer = 60;
      sendBtn.disabled = true;
      sendBtn.textContent = `${timer}s`;
      timerId = setInterval(() => {
        timer -= 1;
        sendBtn.textContent = `${timer}s`;
        if (timer <= 0) {
          clearInterval(timerId);
          sendBtn.disabled = false;
          sendBtn.textContent = '获取验证码';
        }
      }, 1000);
      showToast('验证码已发送（示例 123456）');
    });

    document.getElementById('bindBtn').addEventListener('click', () => {
      const bank = document.getElementById('bankName').value.trim();
      const card = document.getElementById('cardNo').value.trim().replace(/\s/g, '');
      const phone = document.getElementById('phone').value.trim();
      const code = document.getElementById('smsCode').value.trim();
      if (!bank) return showToast('请输入开户行');
      if (!card || card.length < 12) return showToast('请输入正确的银行卡号');
      if (!phone) return showToast('请输入预留手机号');
      if (!code) return showToast('请输入验证码');

      const cards = loadCards();
      if (cards.some(c => c.cardNo === card)) {
        showToast('该银行卡已绑定');
        return;
      }

      cards.unshift({
        bankName: bank,
        cardNo: card,
        phone,
        masked: maskCardNo(card),
        boundAt: new Date().toISOString()
      });
      saveCards(cards);
      clearForm();
      showToast('绑定成功');
      setTimeout(renderBoundCards, 400);
    });

    renderBoundCards();
  </script>
</body>
</html>

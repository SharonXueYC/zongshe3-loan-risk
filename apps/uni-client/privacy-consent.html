<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>隐私协议授权 - 紫色主题</title>
  <style>
    :root {
      --primary: #7b5cf2;
      --primary-dark: #5a3fca;
      --bg: #f5f3ff;
      --card: #ffffff;
      --text: #1f1f2b;
      --muted: #6b6b7a;
      --shadow: 0 14px 40px rgba(93, 67, 210, 0.18);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      font-family: "Inter", "Helvetica", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #f3eefe, #faf7ff);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .phone {
      width: 390px;
      min-height: 760px;
      background: var(--bg);
      border-radius: 32px;
      padding: 20px;
      box-shadow: 0 24px 60px rgba(51, 24, 128, 0.25);
      border: 1px solid rgba(123, 92, 242, 0.15);
      position: relative;
      overflow: hidden;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      padding: 4px 2px 14px;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(140deg, rgba(123, 92, 242, 0.15), rgba(255, 255, 255, 0));
      pointer-events: none;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    .subtitle { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .consents { display: flex; flex-direction: column; gap: 12px; margin: 10px 0 18px; }
    .item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fcfbff;
      border: 1px solid rgba(123, 92, 242, 0.18);
    }
    .checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1.4px solid rgba(123, 92, 242, 0.45);
      display: grid;
      place-items: center;
      cursor: pointer;
      background: #fff;
    }
    .checkbox.checked {
      background: linear-gradient(120deg, var(--primary), #9b7bff);
      border-color: transparent;
      color: #fff;
      font-weight: 800;
    }
    .item-title { font-size: 14px; margin: 0; }
    .item-desc { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(120deg, var(--primary), #9b7bff);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: 0 16px 32px rgba(123, 92, 242, 0.35);
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
    }
    .btn[disabled] { opacity: 0.6; cursor: not-allowed; box-shadow: none; }
    .btn:hover { filter: brightness(1.03); }
    .btn:active { transform: translateY(1px); box-shadow: 0 10px 24px rgba(123, 92, 242, 0.32); }
    .footnote { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }
    .link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      min-width: 52px;
      text-align: right;
      display: inline-block;
    }
    .toast {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 10px 12px;
      background: #1f1f2b;
      color: #fff;
      border-radius: 12px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: 200ms ease;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      z-index: 10;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <section class="phone" aria-label="隐私协议授权">
    <div class="toast" id="toast">请阅读并勾选授权项</div>
    <div class="status-bar">
      <span>09:41</span><span>LTE · 80%</span>
    </div>
    <div class="card">
      <h1>隐私协议授权</h1>
      <p class="subtitle">请阅读并勾选以下授权，确保您知情且同意</p>

      <div class="consents" id="consents">
        <div class="item" data-key="terms">
          <div class="checkbox" aria-label="同意用户协议"></div>
          <div>
            <p class="item-title">用户协议</p>
            <p class="item-desc">包含账户使用、服务条款及安全责任</p>
          </div>
          <a class="link" href="javascript:void(0)" onclick="showToast('请查看完整用户协议')">查看</a>
        </div>
        <div class="item" data-key="privacy">
          <div class="checkbox" aria-label="同意隐私政策"></div>
          <div>
            <p class="item-title">隐私政策</p>
            <p class="item-desc">说明数据收集、存储与使用的范围和目的</p>
          </div>
          <a class="link" href="javascript:void(0)" onclick="showToast('请查看完整隐私政策')">查看</a>
        </div>
        <div class="item" data-key="personal">
          <div class="checkbox" aria-label="同意个人信息授权"></div>
          <div>
            <p class="item-title">个人信息授权</p>
            <p class="item-desc">同意必要的身份信息与联系方式使用</p>
          </div>
          <a class="link" href="javascript:void(0)" onclick="showToast('请查看详细授权说明')">查看</a>
        </div>
      </div>

      <button id="agreeAll" class="btn" disabled>同意所有授权并继续</button>
      <div class="footnote" id="footnote">完成授权后将进入首页</div>
    </div>
  </section>

  <script src="js/api-config.js"></script>
  <script src="js/user-session.js"></script>
  <script>
    const toast = document.getElementById('toast');
    const showToast = (msg) => {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1400);
    };

    const consents = document.querySelectorAll('.item');
    const agreeBtn = document.getElementById('agreeAll');

    consents.forEach(item => {
      const box = item.querySelector('.checkbox');
      box.addEventListener('click', () => {
        box.classList.toggle('checked');
        updateButton();
      });
    });

    function updateButton() {
      const allChecked = [...document.querySelectorAll('.checkbox')].every(el => el.classList.contains('checked'));
      agreeBtn.disabled = !allChecked;
      agreeBtn.textContent = allChecked ? '已同意，前往完善信息' : '同意所有授权并继续';
    }

    const params = new URLSearchParams(window.location.search);
    const fromRegister = params.get('from') === 'register' || sessionStorage.getItem('privacyRequired') === '1';

    if (!fromRegister) {
      const token = localStorage.getItem('token') || sessionStorage.getItem('token');
      window.location.replace(token ? 'main-home.html' : 'login-prototype.html');
    }

    const footnote = document.getElementById('footnote');
    if (fromRegister) {
      footnote.textContent = '完成授权后将进入首页（已使用新注册账号登录）';
    }

    agreeBtn.addEventListener('click', () => {
      if (agreeBtn.disabled) return;
      const userId = UserSession.getUserId();
      if (userId) {
        localStorage.setItem(`privacyConsented_${userId}`, '1');
      }
      sessionStorage.removeItem('privacyRequired');
      showToast('已同意全部授权，正在跳转...');
      setTimeout(() => {
        if (fromRegister) {
          const registeredUserId = sessionStorage.getItem('registeredUserId');
          const token = UserSession.getAuthToken();
          if (token && registeredUserId && userId === registeredUserId) {
            sessionStorage.removeItem('registeredUserId');
            window.location.href = 'main-home.html';
          } else {
            UserSession.clearUserSession();
            window.location.href = 'login-prototype.html';
          }
        } else if (userId && UserSession.getAuthToken()) {
          window.location.href = 'main-home.html';
        } else {
          window.location.href = 'login-prototype.html';
        }
      }, 800);
    });
  </script>
</body>
</html>

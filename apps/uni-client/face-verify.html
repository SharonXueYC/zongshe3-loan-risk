<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人脸验证 - 紫色主题</title>
  <style>
    :root {
      --primary: #7b5cf2;
      --primary-dark: #5a3fca;
      --bg: #f5f3ff;
      --card: #ffffff;
      --text: #1f1f2b;
      --muted: #6b6b7a;
      --shadow: 0 14px 40px rgba(93, 67, 210, 0.18);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      font-family: "Inter", "Helvetica", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #f3eefe, #faf7ff);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .phone {
      width: 390px;
      min-height: 760px;
      background: var(--bg);
      border-radius: 32px;
      padding: 20px;
      box-shadow: 0 24px 60px rgba(51, 24, 128, 0.25);
      border: 1px solid rgba(123, 92, 242, 0.15);
      position: relative;
      overflow: hidden;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      padding: 4px 2px 14px;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(140deg, rgba(123, 92, 242, 0.15), rgba(255, 255, 255, 0));
      pointer-events: none;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    .subtitle { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .face-box {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 4px solid rgba(123, 92, 242, 0.35);
      background: radial-gradient(circle at 30% 30%, rgba(123,92,242,0.18), rgba(123,92,242,0.06));
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      position: relative;
      box-shadow: 0 18px 36px rgba(51, 24, 128, 0.18);
      overflow: hidden;
    }
    .face-box::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 2px dashed rgba(123, 92, 242, 0.55);
      border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
    }
    /* 圆形取景框，模拟摄像头画面 */
    .camera-feed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background: linear-gradient(140deg, rgba(123,92,242,0.12), rgba(155,123,255,0.12));
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 0.6; }
      100% { transform: scale(1.12); opacity: 0.2; }
    }
    .steps { margin: 6px 0 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(120deg, var(--primary), #9b7bff);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: 0 16px 32px rgba(123, 92, 242, 0.35);
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
      margin-top: 6px;
    }
    .btn:hover { filter: brightness(1.03); }
    .btn:active { transform: translateY(1px); box-shadow: 0 10px 24px rgba(123, 92, 242, 0.32); }
    .toast {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 10px 12px;
      background: #1f1f2b;
      color: #fff;
      border-radius: 12px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: 200ms ease;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      z-index: 10;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .footnote { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <section class="phone" aria-label="人脸验证">
    <div class="toast" id="toast">请进行人脸验证</div>
    <div class="status-bar">
      <span>09:41</span><span>LTE · 78%</span>
    </div>
    <div class="card">
      <h1>人脸验证</h1>
      <p class="subtitle">确保为本人操作，完成最后一步身份确认</p>

      <div class="face-box">
        <!-- 可替换为真实摄像头流 <video class="camera-feed" autoplay muted playsinline></video> -->
        <div class="camera-feed"></div>
      </div>

      <div class="steps">
        1. 保持光线充足，摘下口罩和帽子，对准圆形取景框。<br />
        2. 仅用于本次身份验证，不做其他用途。
      </div>

      <button class="btn" id="startFace">开始人脸验证</button>
      <div class="footnote">若验证通过，将进入主页（示例）。</div>
    </div>
  </section>

  <script>
    const toast = document.getElementById('toast');
    const showToast = (msg) => {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1400);
    };

    document.getElementById('startFace').addEventListener('click', () => {
      showToast('正在启动人脸验证...');
      // 示例：模拟“眨眼-点头-彩光”流程
      setTimeout(() => showToast('请眨眼'), 700);
      setTimeout(() => showToast('请上下点头'), 1600);
      setTimeout(() => showToast('请保持不动'), 2500);
      setTimeout(() => {
        showToast('人脸验证通过');
        setTimeout(() => { window.location.href = 'review-progress.html'; }, 900);
      }, 3600);
    });
  </script>

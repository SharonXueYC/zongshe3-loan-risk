<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员审核中 - 紫色主题</title>
  <style>
    :root {
      --primary: #7b5cf2;
      --primary-dark: #5a3fca;
      --bg: #f5f3ff;
      --card: #ffffff;
      --text: #1f1f2b;
      --muted: #6b6b7a;
      --shadow: 0 18px 40px rgba(93, 67, 210, 0.18);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      font-family: "Inter", "Helvetica", "PingFang SC", sans-serif;
      background: linear-gradient(180deg, #f3eefe 0%, #faf7ff 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .phone {
      width: 390px;
      min-height: 760px;
      background: linear-gradient(180deg, #7b5cf2 0%, #9b7bff 55%, #ffffff 100%);
      border-radius: 32px;
      padding: 20px;
      box-shadow: 0 24px 60px rgba(93, 67, 210, 0.25);
      border: 1px solid rgba(123, 92, 242, 0.14);
      position: relative;
      overflow: hidden;
      color: #fff;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      padding: 4px 2px 14px;
    }
    .card {
      background: #fff;
      color: var(--text);
      border-radius: var(--radius);
      padding: 20px 18px;
      box-shadow: var(--shadow);
      margin-top: 18px;
    }
    .hero {
      text-align: center;
      margin-bottom: 16px;
    }
    .hero .badge {
      width: 110px;
      height: 110px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #9b7bff, #7b5cf2);
      display: grid;
      place-items: center;
      box-shadow: 0 18px 36px rgba(93, 67, 210, 0.25);
      position: relative;
    }
    .hero .badge::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid rgba(123,92,242,0.28);
      animation: pulse 1.6s ease-in-out infinite;
    }
    .hero h1 { margin: 0 0 6px; font-size: 22px; }
    .hero p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .steps {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 8px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .step:last-child { border-bottom: none; }
    .dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(123, 92, 242, 0.25);
      display: grid;
      place-items: center;
      font-weight: 700;
      color: var(--primary-dark);
      background: rgba(123,92,242,0.08);
      position: relative;
      overflow: hidden;
    }
    .step.done .dot {
      background: linear-gradient(120deg, var(--primary), #9b7bff);
      color: #fff;
      border-color: transparent;
    }
    .step.active .dot::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
    }
    .step-title { margin: 0; font-size: 15px; font-weight: 700; color: #1d1d2b; }
    .step-desc { margin: 2px 0 0; font-size: 13px; color: #6b6b7a; }
    .footnote { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.65; }
      50% { transform: scale(1.05); opacity: 0.35; }
      100% { transform: scale(1.1); opacity: 0.15; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <section class="phone" aria-label="管理员审核中">
    <div class="status-bar">
      <span>09:41</span><span>LTE · 74%</span>
    </div>
    <div class="card">
      <div class="hero">
        <div class="badge">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6">
            <path d="M12 3l7.5 3v6c0 3.9-3.1 7.4-7.5 9-4.4-1.6-7.5-5.1-7.5-9V6L12 3z"/>
            <path d="M12 8v4l2.4 1.6"/>
          </svg>
        </div>
        <h1>管理员审核中</h1>
        <p>预计 5 分钟内完成，请保持电话畅通</p>
      </div>

      <ul class="steps" id="steps">
        <li class="step" data-idx="0">
          <div class="dot">1</div>
          <div>
            <p class="step-title">借款申请已提交</p>
            <p class="step-desc">系统已生成审核单</p>
          </div>
        </li>
        <li class="step" data-idx="1">
          <div class="dot">2</div>
          <div>
            <p class="step-title">管理员初审</p>
            <p class="step-desc">核对身份与绑卡信息</p>
          </div>
        </li>
        <li class="step" data-idx="2">
          <div class="dot">3</div>
          <div>
            <p class="step-title">终审与额度确认</p>
            <p class="step-desc">综合风险与额度匹配</p>
          </div>
        </li>
        <li class="step" data-idx="3">
          <div class="dot">4</div>
          <div>
            <p class="step-title">放款准备</p>
            <p class="step-desc">准备放款至已绑定银行卡</p>
          </div>
        </li>
      </ul>
      <div class="footnote">审核完成后会自动通知并跳转</div>
    </div>
  </section>

  <script>
    const steps = Array.from(document.querySelectorAll('.step'));
    steps.forEach((step, i) => {
      const dot = step.querySelector('.dot');
      if (dot) dot.dataset.num = `${i + 1}`;
    });

    let current = -1;
    const delays = [1000, 1400, 1800, 1600];

    function setActive(idx) {
      steps.forEach((step, i) => {
        step.classList.remove('active', 'done');
        const dot = step.querySelector('.dot');
        if (!dot) return;
        dot.textContent = dot.dataset.num;
        if (i < idx) {
          step.classList.add('done');
          dot.textContent = '✓';
        } else if (i === idx) {
          step.classList.add('active');
        }
      });
    }

    function run() {
      current += 1;
      if (current >= steps.length) {
        setActive(steps.length);
        // 审核完成，跳转到借款首页或放款结果页
        setTimeout(() => { window.location.href = 'main-home.html'; }, 1200);
        return;
      }
      setActive(current);
      setTimeout(run, delays[current] || 1200);
    }

    setTimeout(run, 600);
  </script>
</body>
</html>

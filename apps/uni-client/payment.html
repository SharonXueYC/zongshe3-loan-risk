<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>付款确认 - 闪借</title>
  <style>
    :root {
      --primary: #7b5cf2;
      --primary-light: #9b7bff;
      --bg: #f5f3ff;
      --card: #ffffff;
      --text: #1f1f2b;
      --muted: #6b6b7a;
      --shadow: 0 18px 40px rgba(93, 67, 210, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", "Helvetica", "PingFang SC", sans-serif;
      background: linear-gradient(180deg, #f3eefe 0%, #faf7ff 100%);
      display: flex;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }
    .phone {
      width: 100%;
      max-width: 390px;
      min-height: 760px;
      border-radius: 32px;
      background: var(--bg);
      border: 1px solid rgba(123, 92, 242, 0.15);
      box-shadow: 0 24px 60px rgba(93, 67, 210, 0.25);
      overflow: hidden;
    }
    .header {
      height: 50px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 17px;
      font-weight: 700;
    }
    .back-btn {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 8px;
    }
    .header-title { flex: 1; text-align: center; margin-right: 40px; }
    .content { padding: 16px; }
    .card {
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .label { color: var(--muted); }
    .amount { color: #5a3fca; font-size: 24px; font-weight: 800; }
    .tip {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .btn {
      margin-top: 14px;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(120deg, var(--primary), #9b7bff);
      cursor: pointer;
    }
    .btn.secondary {
      background: linear-gradient(120deg, #b9a6ff, #c9bbff);
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .toast {
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
      background: #1f1f2b; color: #fff; font-size: 12px; border-radius: 10px;
      padding: 9px 14px; opacity: 0; pointer-events: none; transition: 200ms;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="toast" id="toast">提示</div>
  <section class="phone">
    <header class="header">
      <div class="back-btn" id="backBtn">‹</div>
      <span class="header-title">付款确认</span>
    </header>
    <main class="content">
      <div class="card">
        <div class="row"><span class="label">计划ID</span><span id="planIdText">-</span></div>
        <div class="row"><span class="label">还款类型</span><span id="modeText">-</span></div>
        <div class="row"><span class="label">支付金额</span><span class="amount" id="amountText">¥ 0.00</span></div>
        <p class="tip">点击“确认付款”后将提交还款请求，成功后自动返回还款页并刷新记录。</p>
        <button class="btn" id="confirmBtn">确认付款</button>
        <button class="btn secondary" id="cancelBtn">取消</button>
      </div>
    </main>
  </section>

  <script src="js/api-config.js"></script>
  <script>
    const API_BASE = (window.ZongsheApi && ZongsheApi.getApiBase()) || (localStorage.getItem('apiBase') || 'http://localhost:8080');
    const toast = document.getElementById('toast');
    const CHECKOUT_KEY = '__repayCheckout';

    function parsePlanId(raw) {
      if (raw == null || raw === '') return NaN;
      const s = String(raw).trim();
      if (!s) return NaN;
      const n = Number(s);
      return Number.isFinite(n) && n > 0 ? n : NaN;
    }

    function parseAmount(raw) {
      if (raw == null || raw === '') return NaN;
      const s = String(raw).trim().replace(/,/g, '');
      if (!s) return NaN;
      const n = Number(s);
      return Number.isFinite(n) ? n : NaN;
    }

    const params = new URLSearchParams(window.location.search);
    let planId = parsePlanId(params.get('planId'));
    let amount = parseAmount(params.get('amount'));
    let mode = (params.get('mode') || 'full').trim() || 'full';

    try {
      const backup = JSON.parse(sessionStorage.getItem(CHECKOUT_KEY) || 'null');
      const fresh =
        backup &&
        typeof backup === 'object' &&
        typeof backup.ts === 'number' &&
        Date.now() - backup.ts < 30 * 60 * 1000;
      if (
        fresh &&
        (!Number.isFinite(planId) || planId <= 0 || !Number.isFinite(amount) || amount <= 0)
      ) {
        const bp = parsePlanId(backup.planId);
        const ba = parseAmount(backup.amount);
        if (Number.isFinite(bp) && bp > 0 && Number.isFinite(ba) && ba > 0) {
          planId = bp;
          amount = ba;
          if (backup.mode === 'partial' || backup.mode === 'full') mode = backup.mode;
        }
      }
    } catch (_) { /* ignore */ }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1600);
    }

    function getAuthToken() {
      const urlToken = new URLSearchParams(window.location.search).get('token');
      const candidates = [localStorage.getItem('token'), sessionStorage.getItem('token'), urlToken];
      const raw = (candidates.find(v => typeof v === 'string' && v.trim()) || '').trim();
      if (!raw || raw === 'undefined' || raw === 'null') return '';
      return raw.startsWith('Bearer ') ? raw.slice(7).trim() : raw;
    }

    async function request(path, options = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
      const token = getAuthToken();
      if (token) headers.Authorization = `Bearer ${token}`;
      const res = await fetch(`${API_BASE}${path}`, {
        method: options.method || 'GET',
        headers,
        body: options.body ? JSON.stringify(options.body) : undefined
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || `请求失败(${res.status})`);
      return data;
    }

    const paramsOk = Number.isFinite(planId) && planId > 0 && Number.isFinite(amount) && amount > 0;
    document.getElementById('planIdText').textContent = paramsOk ? String(planId) : '-';
    document.getElementById('modeText').textContent = mode === 'partial' ? '部分还款' : '全额还款';
    document.getElementById('amountText').textContent = `¥ ${(paramsOk ? amount : 0).toFixed(2)}`;
    if (!paramsOk) {
      const tip = document.querySelector('.tip');
      if (tip) {
        tip.textContent = '未识别到有效的计划与金额，请返回「还款」页重新选择计划后再付款；若从书签打开本页，将无法付款。';
      }
      document.getElementById('confirmBtn').disabled = true;
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      try { sessionStorage.removeItem(CHECKOUT_KEY); } catch (_) { /* ignore */ }
      window.location.href = 'repay.html';
    });
    document.getElementById('cancelBtn').addEventListener('click', () => {
      try { sessionStorage.removeItem(CHECKOUT_KEY); } catch (_) { /* ignore */ }
      window.location.href = 'repay.html';
    });

    document.getElementById('confirmBtn').addEventListener('click', async () => {
      if (!Number.isFinite(planId) || planId <= 0 || !Number.isFinite(amount) || amount <= 0) {
        showToast('付款参数异常：请从还款页重新进入，或检查链接是否完整');
        return;
      }
      const btn = document.getElementById('confirmBtn');
      btn.disabled = true;
      const old = btn.textContent;
      btn.textContent = '支付中...';
      try {
        const result = await request('/api/repayment/pay', {
          method: 'POST',
          body: {
            planId,
            amount,
            repayMethod: 'ONLINE',
            transactionId: `WEB-${Date.now()}`
          }
        });
        if (!result.success) throw new Error(result.message || '付款失败');
        try { sessionStorage.removeItem(CHECKOUT_KEY); } catch (_) { /* ignore */ }
        showToast('付款成功');
        setTimeout(() => { window.location.href = 'repay.html?paid=1'; }, 700);
      } catch (e) {
        showToast(e.message || '付款失败');
      } finally {
        btn.disabled = false;
        btn.textContent = old;
      }
    });
  </script>
</body>
</html>

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20m;

        # 后端 API
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Swagger / OpenAPI（勿与 location / 用户 H5 冲突）
        location = /swagger-ui.html {
            proxy_pass http://backend/swagger-ui.html;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /swagger-ui/ {
            proxy_pass http://backend/swagger-ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api-docs {
            proxy_pass http://backend/api-docs;
            proxy_set_header Host $host;
        }
        location /v3/ {
            proxy_pass http://backend/v3/;
            proxy_set_header Host $host;
        }
        location /webjars/ {
            proxy_pass http://backend/webjars/;
            proxy_set_header Host $host;
        }

        # 管理端 Vue SPA
        location /admin/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # 手机用户端（HTML 静态页）
        location / {
            root /usr/share/nginx/html/mobile;
            index start.html login-prototype.html;
            try_files $uri $uri/ =404;
        }
    }
}

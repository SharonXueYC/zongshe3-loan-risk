# 生产环境：关闭 SQL 调试、降低日志级别
spring.jpa.show-sql=false
logging.level.com.example.zongshe1=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN

# CORS（可通过环境变量 CORS_ALLOWED_ORIGINS 覆盖，逗号分隔）
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1,*}

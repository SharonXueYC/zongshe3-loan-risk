# Server Configuration
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/

# Database Configuration (override via environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zongshe?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging Configuration
logging.level.com.example.zongshe1=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# File output
logging.file.name=logs/application.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/META-INF/resources/
spring.web.resources.cache.period=3600
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# App Configuration (sensitive values should be set via environment variables)
app.admin.username=${ADMIN_USERNAME:yunizai}
app.admin.password=${ADMIN_PASSWORD:yunizai123}
app.admin.name=${ADMIN_NAME:管理员}
app.jwt.secret=${JWT_SECRET:speedloan-secret-key-change-me-in-production}
app.jwt.expiration=${JWT_EXPIRATION:7200}
app.jwt.header=Authorization
app.system.min-loan-amount=1000.00
app.system.max-loan-amount=500000.00
app.system.default-credit-score=500
app.system.min-credit-score-for-loan=450
app.system.loan-terms=3,6,12,24,36
app.system.overdue-penalty-rate=0.0005

# 风控 · 评分卡（演示引擎，可开关）
risk.scoring-card.enabled=true
risk.scoring-card.version=demo-v1
risk.scoring-card.pass-min-points=40

# 多数据源 · 演示适配器（后期替换为真实 HTTP/SDK 实现）
datasource.credit-bureau.enabled=true
datasource.credit-bureau.timeout-ms=3000
datasource.credit-bureau.required=false
datasource.telecom.enabled=true
datasource.telecom.timeout-ms=2000
datasource.risk-rule.enabled=true
datasource.risk-rule.max-overdue-count=2

# 数据爬取（演示页 → 缓存 → 风控融合）
crawler.credit-bureau.url=classpath:crawler/demo-credit.html
crawler.telecom.url=classpath:crawler/demo-telecom.html
crawler.cache-ttl-hours=24
crawler.scheduled.enabled=true
crawler.scheduled.initial-delay-ms=120000
crawler.scheduled.fixed-delay-ms=21600000

# 逾期检测定时任务（每天凌晨 1 点）
repay.overdue.cron=0 0 1 * * ?
